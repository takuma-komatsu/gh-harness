name: Release gh extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            asset: gh-harness-linux-amd64
            executable: GhHarness
          - runner: ubuntu-latest
            rid: linux-arm64
            asset: gh-harness-linux-arm64
            executable: GhHarness
          - runner: macos-latest
            rid: osx-x64
            asset: gh-harness-darwin-amd64
            executable: GhHarness
          - runner: macos-latest
            rid: osx-arm64
            asset: gh-harness-darwin-arm64
            executable: GhHarness
          - runner: windows-latest
            rid: win-x64
            asset: gh-harness-windows-amd64.exe
            executable: GhHarness.exe
          - runner: windows-latest
            rid: win-arm64
            asset: gh-harness-windows-arm64.exe
            executable: GhHarness.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish single-file extension
        shell: pwsh
        run: |
          dotnet publish src/GhHarness/GhHarness.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item (Join-Path publish '${{ matrix.executable }}') (Join-Path dist '${{ matrix.asset }}')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
