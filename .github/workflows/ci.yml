name: CI

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/GhHarness.Tests/GhHarness.Tests.csproj
      - name: Build
        run: dotnet build tests/GhHarness.Tests/GhHarness.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/GhHarness.Tests/GhHarness.Tests.csproj -c Release --no-build
      - name: Pack
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'gh-harness-pack'
          dotnet pack src/GhHarness/GhHarness.csproj -c Release --no-restore -o $packageDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and smoke test local tool
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'gh-harness-pack'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'gh-harness-tool'
          dotnet tool install gh-harness --version 0.1.1 --tool-path $toolDirectory --add-source $packageDirectory --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolName = if ($IsWindows) { 'gh-harness.exe' } else { 'gh-harness' }
          & (Join-Path $toolDirectory $toolName) --explain help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and smoke test released gh extension
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install takuma-komatsu/gh-harness --pin v0.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh harness --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh harness --explain help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
